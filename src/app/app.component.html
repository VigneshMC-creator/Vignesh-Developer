<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" fragment="overview" aria-label="Vignesh Developer home">
      <span class="brand-name">VIGNESH<span class="brand-suffix">.DEV</span></span>
      <i class="brand-server-light" aria-hidden="true" title="Developer status indicator"></i>
    </a>

    <nav class="main-nav" id="primaryNav" [class.open]="mobileMenuOpen" aria-label="Main navigation">
      <a routerLink="/" fragment="overview" (click)="closeMobileMenu()">Overview</a>
      <a routerLink="/" fragment="about" (click)="closeMobileMenu()">About</a>
      <a routerLink="/" fragment="experience" (click)="closeMobileMenu()">Experience</a>
      <a routerLink="/" fragment="work" (click)="closeMobileMenu()">Projects</a>
      <a routerLink="/" fragment="stack" (click)="closeMobileMenu()">Stack</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a>
    </nav>

    <button class="nav-menu" type="button" (click)="toggleNavigation()"
      [attr.aria-expanded]="mobileMenuOpen" aria-controls="primaryNav"
      [attr.aria-label]="mobileMenuOpen ? 'Close navigation' : 'Open navigation'">
      {{ mobileMenuOpen ? '×' : '☰' }}
    </button>

    <button class="theme-toggle" type="button" (click)="toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
      <span aria-hidden="true">{{ themeService.theme() === 'dark' ? '☀' : '☾' }}</span>
      {{ themeService.theme() === 'dark' ? 'Light' : 'Dark' }}
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-identity">
      <svg class="footer-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <ellipse cx="12" cy="5" rx="7.3" ry="2.7" stroke="currentColor" stroke-width="1.6"/>
        <path d="M4.7 5v13.2c0 1.5 3.3 2.8 7.3 2.8s7.3-1.3 7.3-2.8V5M4.7 9.4c0 1.5 3.3 2.8 7.3 2.8s7.3-1.3 7.3-2.8M4.7 13.8c0 1.5 3.3 2.8 7.3 2.8s7.3-1.3 7.3-2.8" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span>© {{ currentYear }} Vignesh Madhav Kumar Edara. All Rights Reserved.</span>
    </div>

    <nav class="footer-nav" aria-label="Footer navigation">
      <a routerLink="/" fragment="overview">Overview</a>
      <a routerLink="/" fragment="experience">Experience</a>
      <a routerLink="/" fragment="work">Projects</a>
      <a routerLink="/contact">Contact</a>
    </nav>

    <a class="back-to-top" routerLink="/" fragment="overview" aria-label="Back to top" title="Back to top">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</footer>
