<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
(function(){
 var base='/portfolio/',path=window.location.pathname;
 if(path.indexOf(base)===0 && path!==base){
  var route=path.slice(base.length)+window.location.search+window.location.hash;
  try{sessionStorage.setItem('vignesh-pages-redirect',route)}catch(_){}
  window.location.replace(base);
 }
})();
</script></head><body></body></html>
